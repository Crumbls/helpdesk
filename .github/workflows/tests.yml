name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP 8.3
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '9.*'
            testbench: '^7.0'
            pest: '^1.0'
            var-dumper: '^6.0'
          - laravel: '10.*'
            testbench: '^8.0'
            pest: '^2.0'
            var-dumper: '^7.0'
          - laravel: '11.*'
            testbench: '^9.0'
            pest: '^3.0'
            var-dumper: '^7.0'
          - laravel: '12.*'
            testbench: '^10.9'
            pest: '^4.0'
            var-dumper: '^7.3'
          - laravel: '13.*'
            testbench: '^11.0'
            pest: '^4.0'
            var-dumper: '^7.3'

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer remove --dev pestphp/pest pestphp/pest-plugin-type-coverage symfony/var-dumper --no-interaction --no-update
          composer require --no-interaction --no-update "laravel/framework:${{ matrix.laravel }}"
          composer require --dev --no-interaction --no-update "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "symfony/var-dumper:${{ matrix.var-dumper }}"
          composer update --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/pest --no-coverage
